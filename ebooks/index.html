<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서재</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy: #1a2744;
  --navy-light: #243460;
  --navy-pale: #e8ecf5;
  --gold: #c9a84c;
  --white: #ffffff;
  --bg: #f7f7f5;
  --gray-mid: #d0d5e8;
  --text-body: #2c3350;
  --text-sub: #7a8090;
}

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text-body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  background: var(--navy);
  padding: 32px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.site-title {
  font-size: 18px;
  font-weight: 900;
  color: var(--white);
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.site-title span {
  color: var(--gold);
  margin-left: 2px;
}

.search-wrap {
  position: relative;
  flex: 0 0 280px;
}
.search-wrap input {
  width: 100%;
  padding: 9px 14px 9px 38px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px;
  color: var(--white);
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}
.search-wrap input:focus {
  border-color: var(--gold);
  background: rgba(255,255,255,0.12);
}
.search-wrap input::placeholder { color: rgba(255,255,255,0.35); }
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  opacity: 0.4;
  pointer-events: none;
}

/* ── MAIN ── */
main {
  max-width: 1080px;
  margin: 0 auto;
  padding: 56px 40px 80px;
}

/* ── SECTION ── */
.section { margin-bottom: 56px; }

.section-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 24px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--gray-mid);
}
.section-bar {
  width: 4px;
  height: 22px;
  border-radius: 2px;
  flex-shrink: 0;
  background: var(--gold);
}
.section-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.28em;
  color: var(--gold);
  text-transform: uppercase;
  display: block;
  margin-bottom: 3px;
}
.section-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -0.01em;
}
.section-count {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-sub);
}

/* ── GRID ── */
.book-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}

/* ── CARD ── */
.book-card {
  background: var(--white);
  border: 1px solid #dfe3ef;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  text-decoration: none;
  color: inherit;
  overflow: hidden;
  transition: box-shadow 0.18s, border-color 0.18s, transform 0.18s;
}
.book-card:hover {
  transform: translateY(-2px);
  border-color: #bcc5e0;
  box-shadow: 0 6px 24px rgba(26,39,68,0.10);
}

.card-accent {
  height: 3px;
  width: 100%;
  flex-shrink: 0;
}

.card-body {
  padding: 20px 22px 18px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.card-tag {
  display: inline-block;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  background: rgba(201,168,76,0.10);
  border: 1px solid rgba(201,168,76,0.25);
  border-radius: 4px;
  padding: 2px 8px;
  margin-bottom: 12px;
  align-self: flex-start;
}

.card-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.45;
  margin-bottom: 8px;
  word-break: keep-all;
}

.card-sub {
  font-size: 12px;
  color: var(--text-sub);
  line-height: 1.6;
  flex: 1;
  word-break: keep-all;
}

.card-footer {
  margin-top: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-date {
  font-size: 10.5px;
  color: #b0b8cc;
  letter-spacing: 0.02em;
}
.card-cta {
  font-size: 11px;
  font-weight: 700;
  color: var(--navy-light);
  letter-spacing: 0.05em;
  opacity: 0;
  transition: opacity 0.18s;
}
.book-card:hover .card-cta { opacity: 1; }

/* ── EMPTY ── */
.empty {
  display: none;
  padding: 60px 0;
  text-align: center;
  color: var(--text-sub);
  font-size: 13px;
}

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--gray-mid);
  padding: 24px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.footer-left {
  font-size: 11px;
  color: var(--text-sub);
  letter-spacing: 0.05em;
}
.footer-right {
  font-size: 11px;
  color: #b0b8cc;
}
.footer-right a {
  color: var(--navy-light);
  text-decoration: none;
  font-weight: 500;
}

/* ── HIDDEN ── */
.hidden { display: none !important; }

@media (max-width: 600px) {
  header { padding: 22px 20px; flex-wrap: wrap; }
  .search-wrap { flex: 1 1 100%; }
  main { padding: 36px 20px 60px; }
  footer { flex-direction: column; gap: 8px; padding: 20px; text-align: center; }
}
</style>
</head>
<body>

<header>
  <div class="site-title">서재<span>.</span></div>
  <div class="search-wrap">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="q" type="text" placeholder="검색" autocomplete="off" spellcheck="false">
  </div>
</header>

<main>
  <div id="sections"></div>
  <div class="empty" id="empty">검색 결과가 없습니다.</div>
</main>

<footer>
  <div class="footer-left" id="foot-meta"></div>
  <div class="footer-right"><a href="https://github.com/davidlikescat" target="_blank">@davidlikescat</a></div>
</footer>

<script>
fetch('./books.json')
  .then(r => r.json())
  .then(init)
  .catch(() => {
    document.getElementById('sections').innerHTML =
      '<p style="padding:60px 0;color:#b0b8cc;text-align:center;font-size:13px;">books.json을 불러올 수 없습니다.</p>';
  });

function init(data) {
  const total = data.categories.reduce((n, c) => n + c.books.length, 0);
  document.getElementById('foot-meta').textContent =
    `${total}권 · ${data.lastUpdated} 업데이트`;

  const wrap = document.getElementById('sections');
  data.categories.forEach(cat => {
    const sec = document.createElement('section');
    sec.className = 'section';
    sec.dataset.id = cat.id;
    sec.innerHTML = `
      <div class="section-header">
        <div class="section-bar" style="background:${cat.color}"></div>
        <div>
          <span class="section-label">${cat.id}</span>
          <span class="section-title">${cat.name}</span>
        </div>
        <span class="section-count">${cat.books.length}권</span>
      </div>
      <div class="book-grid">
        ${cat.books.map(b => card(b, cat.color)).join('')}
      </div>
    `;
    wrap.appendChild(sec);
  });

  document.getElementById('q').addEventListener('input', e => {
    const q = e.target.value.toLowerCase().trim();
    let any = false;
    document.querySelectorAll('.book-card').forEach(el => {
      const hit = !q || el.dataset.search.includes(q);
      el.classList.toggle('hidden', !hit);
      if (hit) any = true;
    });
    document.querySelectorAll('.section').forEach(sec => {
      const visible = [...sec.querySelectorAll('.book-card')].some(c => !c.classList.contains('hidden'));
      sec.classList.toggle('hidden', !visible);
    });
    document.getElementById('empty').style.display = any ? 'none' : 'block';
  });
}

function card(b, color) {
  const search = (b.title + ' ' + b.subtitle + ' ' + b.tag).toLowerCase();
  return `
    <a class="book-card" href="${b.url}" target="_blank" data-search="${search}">
      <div class="card-accent" style="background:${color}"></div>
      <div class="card-body">
        <span class="card-tag">${b.tag}</span>
        <div class="card-title">${b.title}</div>
        <div class="card-sub">${b.subtitle}</div>
        <div class="card-footer">
          <span class="card-date">${b.date}</span>
          <span class="card-cta">열기 →</span>
        </div>
      </div>
    </a>
  `;
}
</script>
</body>
</html>
